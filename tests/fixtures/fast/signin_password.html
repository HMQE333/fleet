<!doctype html>
<html><head><title>Log in</title></head><body>
<h1>Log in</h1>
<p>Signing in as <strong id="who"></strong></p>
<form id="f">
  <label>Password <input name="p" type="password" autocomplete="current-password"></label>
  <button type="submit">Log in</button>
</form>
<p id="msg"></p>
<script>
const u = new URLSearchParams(location.search).get('email');
document.getElementById('who').textContent = u;
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  if (u === 'alice@example.test' && e.target.p.value === 'correct horse battery') {
    document.body.innerHTML = '<h1>Welcome back, alice</h1><p>You are logged in.</p>';
  } else {
    document.getElementById('msg').textContent = 'Wrong password';
  }
});
</script>
</body></html>
