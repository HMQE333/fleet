<!doctype html>
<html><head><title>Account settings</title></head><body>
<h1>Change your password</h1>
<form>
  <label>Current password <input name="current" type="password" autocomplete="current-password"></label>
  <label>New password <input name="new" type="password" autocomplete="new-password"></label>
  <label>Repeat new password <input name="repeat" type="password"></label>
  <button type="submit">Update password</button>
</form>
</body></html>
